gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}

spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cache:
    type: redis
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}



  #  ai:
  #    openai:
  #      api-key: ${API_AI_KEY}
  #      audio:
  #        transcription:
  #          options:
  #            model: whisper-1
  #            response-format: json
  #          base-url: https://api.openai.com


  datasource:
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${DATABASE_URL}:${DATABASE_PORT};databaseName=MusicLD;encrypt=true;trustServerCertificate=true;
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    hikari:
      minimum-idle: 10         # Đảm bảo có đủ kết nối tối thiểu
      maximum-pool-size: 30    # Tăng số kết nối tối đa nếu cần thiết
      idle-timeout: 30000      # Thời gian chờ kết nối không sử dụng trước khi đóng
      max-lifetime: 1800000    # Thời gian tối đa mỗi kết nối sống

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
    open-in-view: false

  application:
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY}
        expiration: 3600000     # 1 h in milliseconds
        refresh-token:
          expiration: 604800000 # 7 days in milliseconds

  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: http://localhost:8080/issuer
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_CLIENT_URL_REDIRECT}
            scope:
              - email
              - profile

          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: ${FACEBOOK_CLIENT_URL_REDIRECT}
            scope:
              - email
              - public_profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp:
        auth: true
        starttls:
          enable: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  elasticsearch:
    uris: http://localhost:9200


payment:
  vnPay:
    url: ${PAY_URL}
    tmnCode: ${TMN_CODE}
    secretKey: ${SECRET_KEY}
    returnUrl: ${RETURN_URL}
    version: ${VERSION}
    command: ${COMMAND}
    orderType: ${ORDER_TYPE}

server:
  port: ${API_PORT:8080}

cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY}
  api-secret: ${API_SECRET}

expiration-OTP: 300000 # 5 minutes
